<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Admin | Mara</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./admin.css" />
    <style>
      /* Estilos de carga mínimos para una apariencia limpia. El resto lo maneja admin.css */
      body { display: none; } /* Ocultar cuerpo hasta que el script de abajo lo muestre */
      .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #18181B;
        font-family: 'Montserrat', sans-serif;
        color: #F2F2F2;
      }
      .auth-message {
        padding: 2em;
        background-color: #27272A;
        border-radius: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body data-page="admin">
    <!-- Contenedor de autenticación y carga. Se elimina después de que Decap se renderiza. -->
    <div id="auth-container" class="auth-container">
      <div class="auth-message">Cargando panel de administración...</div>
    </div>
    
    <!-- Decap CMS root element -->
    <div id="nc-root"></div>

    <script>
      // Lógica para mostrar el body solo cuando es necesario, evitando FOUC (Flash of Unstyled Content)
      document.addEventListener('DOMContentLoaded', function() {
        // Si no estamos en la página de autenticación de Netlify/Decap, muestra el body.
        if (window.location.hash.indexOf('auth=') === -1) {
          document.body.style.display = 'block';
        }
        // El script de autenticación de Decap se encargará de los popups.
        // Si hay un error de carga, el panel no se mostrará, lo cual es aceptable.
      });

      // Manejo de errores simplificado. Los errores críticos se mostrarán en la consola.
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.message);
        const authMessage = document.querySelector('#auth-container .auth-message');
        if (authMessage) {
          authMessage.textContent = 'Error al cargar. Revisa la consola (F12).';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e.reason);
        const authMessage = document.querySelector('#auth-container .auth-message');
        if (authMessage) {
          authMessage.textContent = 'Error al cargar. Revisa la consola (F12).';
        }
      });
    </script>
    
<!-- Carga de Decap CMS y su localización en español -->
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@3.7.2/dist/decap-cms.js"></script>
<script src="https://unpkg.com/decap-cms-locales@1.7.0/dist/umd/es.js"></script>
<script>
  // Registra la localización en español
  if (window.es) {
    CMS.registerLocale('es', window.es);
  }

  // Inicializa el CMS
  try {
    CMS.init({ config: { load_config_file: true } });
    console.log('CMS initialized successfully.');
  } catch (e) {
    console.error('CMS init error:', e);
    const authMessage = document.querySelector('#auth-container .auth-message');
    if (authMessage) {
      authMessage.textContent = 'Error fatal al iniciar el CMS. Revisa la consola.';
    }
  }
</script>

  

  </body>
</html>
